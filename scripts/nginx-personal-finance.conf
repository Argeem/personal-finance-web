# ==============================================================================
# NGINX Configuration Snippet for FinTrack Pro (Personal Financial Web)
# URL: https://your-domain.com/personal/finance/
# ==============================================================================
#
# วิธีใช้งาน:
# นำบล็อกนี้ไปวางในไฟล์ server config เดิมของคุณ (เช่น argeem-web)
# ภายในบล็อก `server { ... }` หรือ include ไฟล์นี้:
#
#   server {
#       listen 80;
#       listen 443 ssl;
#       server_name argeem.com; # (หรือโดเมนของคุณ)
#
#       # ... config เว็บหลัก argeem-web ...
#
#       # FinTrack Pro Subpath Routing
#       include /etc/nginx/snippets/personal-finance.conf;
#   }
# ==============================================================================

# 1. Redirect URL ที่ไม่มี trailing slash ไปยัง /personal/finance/
location = /personal/finance {
    return 301 /personal/finance/;
}

# 2. Main SPA Location สำหรับ /personal/finance/
location ^~ /personal/finance/ {
    alias /var/www/personal-financial-web/dist/;
    index index.html;
    try_files $uri $uri/ /personal/finance/index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No-cache สำหรับ index.html เพื่อให้ได้เวอร์ชันล่าสุดเสมอเวลา deploy
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# 3. Static Assets Caching (Vite hash files เช่น index-xxxx.js, index-xxxx.css)
location ~* ^/personal/finance/assets/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
    alias /var/www/personal-financial-web/dist/assets/$1;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
